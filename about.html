<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="About Aliro Consulting - Senior-led healthcare strategic intelligence and transformation advisory firm."
    />
    <title>About Us | Aliro Consulting</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Swiper CSS CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages/about/about-layout.css" />
  </head>
  <body class="page-about">
    <!-- Top Navigation Header (Reusable Component) -->
    <header class="navbar-overlay light-theme" id="mainHeader"></header>

    <!-- Swiper Fullscreen Container for About Us (8 Figma Sections Preview) -->
    <main class="swiper main-swiper" id="scrollContainer">
      <div class="swiper-wrapper">
        
        <!-- Section 1 -->
        <section class="scroll-section swiper-slide sec-about-mockup" id="section-about-1" data-section-index="0">
          <img src="assets/mock_about/sec-1.png" alt="About Section 1" class="mockup-img" onerror="this.style.opacity='0'" />
        </section>

        <!-- Section 2 -->
        <section class="scroll-section swiper-slide sec-about-mockup" id="section-about-2" data-section-index="1">
          <img src="assets/mock_about/sec-2.png" alt="About Section 2" class="mockup-img" onerror="this.style.opacity='0'" />
        </section>

        <!-- Section 3 -->
        <section class="scroll-section swiper-slide sec-about-mockup" id="section-about-3" data-section-index="2">
          <img src="assets/mock_about/sec-3.png" alt="About Section 3" class="mockup-img" onerror="this.style.opacity='0'" />
        </section>

        <!-- Section 4 -->
        <section class="scroll-section swiper-slide sec-about-mockup" id="section-about-4" data-section-index="3">
          <img src="assets/mock_about/sec-4.png" alt="About Section 4" class="mockup-img" onerror="this.style.opacity='0'" />
        </section>

        <!-- Section 5 -->
        <section class="scroll-section swiper-slide sec-about-mockup" id="section-about-5" data-section-index="4">
          <img src="assets/mock_about/sec-5.png" alt="About Section 5" class="mockup-img" onerror="this.style.opacity='0'" />
        </section>

        <!-- Section 6 -->
        <section class="scroll-section swiper-slide sec-about-mockup" id="section-about-6" data-section-index="5">
          <img src="assets/mock_about/sec-6.png" alt="About Section 6" class="mockup-img" onerror="this.style.opacity='0'" />
        </section>

        <!-- Section 7 -->
        <section class="scroll-section swiper-slide sec-about-mockup" id="section-about-7" data-section-index="6">
          <img src="assets/mock_about/sec-7.png" alt="About Section 7" class="mockup-img" onerror="this.style.opacity='0'" />
        </section>

        <!-- Section 8 -->
        <section class="scroll-section swiper-slide sec-about-mockup" id="section-about-8" data-section-index="7">
          <img src="assets/mock_about/sec-8.png" alt="About Section 8" class="mockup-img" onerror="this.style.opacity='0'" />
        </section>

      </div>
    </main>

    <!-- Swiper JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Application Script Engine -->
    <script src="script.js"></script>
  </body>
</html>
